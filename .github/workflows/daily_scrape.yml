name: Daily Oil Price Scraper

on:
  schedule:
    # Runs daily at 12:00 UTC (8:00 AM EDT)
    - cron: '0 12 * * *'
  # Allows you to manually trigger the script anytime from the Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push New Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update daily oil prices and feed [$(date +'%Y-%m-%d')]" || exit 0
          git push
